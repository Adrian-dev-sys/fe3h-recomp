<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- FE3H Recomp: three plain heater shields (red, blue, gold) on slate, gold trim. Original artwork, no game marks. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#121726"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e3c278" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e3c278" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8423a"/><stop offset="1" stop-color="#7d1f1c"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f6fc4"/><stop offset="1" stop-color="#1d3a78"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0cf6a"/><stop offset="1" stop-color="#b8892a"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc9c"/><stop offset="1" stop-color="#b8924c"/></linearGradient>
    <!-- a heater shield, 240 wide x 290 tall, top-left at 0,0 -->
    <path id="shield" d="M0,0 H240 V120 C240,205 175,262 120,290 C65,262 0,205 0,120 Z"/>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#glow)"/>
  <rect x="62" y="62" width="900" height="900" rx="172" fill="none" stroke="url(#rim)" stroke-width="10" opacity="0.85"/>
  <!-- side shields behind, tilted outward; the middle one in front -->
  <g transform="translate(222,385) rotate(-14 120 145)">
    <use href="#shield" fill="url(#red)" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <g transform="translate(562,385) rotate(14 120 145)">
    <use href="#shield" fill="url(#gold)" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <g transform="translate(392,345)">
    <use href="#shield" fill="url(#blue)" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <!-- a gold baseline -->
  <rect x="262" y="752" width="500" height="10" rx="5" fill="url(#rim)" opacity="0.9"/>
</svg>
